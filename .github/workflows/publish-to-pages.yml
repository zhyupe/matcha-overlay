name: Build and Deploy
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache Node Dependencies 🎶
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Create env file 🍕
        run: |
          touch .env

      - name: Install and Build 🔧
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Verify build output
        run: |
          if [ ! -s dist/index.html ]; then
            echo "::error file=dist/index.html::Build output is missing or empty"
            exit 1
          fi

      - name: Upload artifact 🎁
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-tencent-cloud:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Deploy to TencentCloud 🚀
        uses: TencentCloud/cos-action@v1
        with:
          secret_id: ${{ secrets.COS_SECRET_ID }}
          secret_key: ${{ secrets.COS_SECRET_KEY }}
          cos_bucket: ${{ secrets.COS_BUCKET }}
          cos_region: 'ap-chengdu'
          local_path: dist
          clean: true
      - name: Purge CDN Cache
        uses: TencentCloud/cli-action@v1
        with:
          secret_id: ${{ secrets.TENCENT_CDN_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_CDN_SECRET_KEY }}
          region: 'ap-chengdu'
          commands: cdn PurgeUrlsCache --cli-unfold-argument --Urls 'https://matcha-overlay.ffcafe.cn/'
          output_format: json
